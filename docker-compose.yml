services:
  mysql:
    image: mysql:8
    container_name: academia-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - academia-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  back-despachos:
    build: ./back-Despachos_SpringBoot
    image: innovatech-back-despachos:1.0
    ports:
      - "8081:8081"
    environment:
      # Variables que espera tu application.properties
      DB_ENDPOINT: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - academia-net
    restart: unless-stopped

  back-ventas:
    build: ./back-Ventas_SpringBoot
    image: innovatech-back-ventas:1.0
    ports:
      - "8080:8080"   # Asumiendo que usa puerto 8080
    environment:
      DB_ENDPOINT: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - academia-net
    restart: unless-stopped

  # Frontend lo agregaremos después
  # frontend:
  #   build: ./frontend
  #   ...

volumes:
  mysql_data:
    name: innovatech_mysql_data   # Named volume para persistencia

networks:
  academia-net:
    driver: bridge